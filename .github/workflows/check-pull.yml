name: Check Pull Request

on:
    pull_request:
        paths-ignore:
            - .github/workflows/**

jobs:
    check:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: lts/*
                  cache: "npm"

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable

            - name: Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: |
                      ./src-tauri -> target
                      ./crates/screencap -> target

            - name: Install frontend dependencies
              run: npm install

            - name: Typecheck
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Check formatting
              run: npm run format:check

            - name: Build frontend
              run: npm run build

            - name: Check Rust formatting (app)
              run: cargo fmt --check
              working-directory: src-tauri

            - name: Check Rust formatting (screencap)
              run: cargo fmt --check
              working-directory: crates/screencap

            - name: Check app
              run: cargo check
              working-directory: src-tauri

            - name: Check screencap
              run: cargo check
              working-directory: crates/screencap

            - name: Test app
              run: cargo test --lib
              working-directory: src-tauri

            - name: Test screencap
              run: cargo test --lib
              working-directory: crates/screencap
