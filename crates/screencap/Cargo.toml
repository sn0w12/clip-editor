[package]
name = "screencap"
version = "0.1.0"
edition = "2024"
description = "Crash-tolerant multi-track replay buffer for Windows"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
directories = "6.0"
figment = { version = "0.10", features = ["toml", "env"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
global-hotkey = "0.8"
cpal = "0.18"
rubato = "4.0"
sysinfo = "0.39"
ffmpeg-sidecar = { version = "2.5", features = ["named_pipes"] }
parking_lot = "0.12"
windows = { version = "0.62", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_Audio",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0"
wasapi = "0.23"

[dev-dependencies]
criterion = "0.5"
serde_json = "1"
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[[bench]]
name = "router"
harness = false

[[bench]]
name = "resample"
harness = false

[[bench]]
name = "write_f32le"
harness = false

[[bench]]
name = "sanitize"
harness = false

[[bench]]
name = "config"
harness = false

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
codegen-units = 1
