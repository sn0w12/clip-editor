[package]
name = "tauri-plugin-snap-layout"
# Tracks upstream 1.0.9. Bump together with the vendored sources.
version = "1.0.9"
description = "Native Windows 11 snap layouts for a frameless Tauri window, via a transparent Win32 hit-test overlay"
edition = "2021"
rust-version.workspace = true
license = "MIT"
links = "tauri-plugin-snap-layout"
publish = false

# Vendored from Hyph-M/tauri-plugin-snap-layout at 1.0.9 with the pressed-state
# change from pull/1 (mydouleur/tauri-plugin-snap-layout, branch `active_adopt`,
# commit 3f846e3), which emits tauri-snap://snap/mousedown and mouseup so the
# button can mirror its pressed state. Upstream had no press signal, only hover.
#
# Only src/ and dist-js/inline-injection.js are vendored. The example app, the
# guest-js sources and the rollup toolchain are not: the bundled script is
# committed upstream, so it is taken as built.
[dependencies]
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-version = "0.1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[lints.clippy]
all = "warn"
